name: Build

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            qt-arch: win32_msvc2019
            artifact-name: spark-ts-tools-windows
            executable: spark-ts-tools.exe
          - os: ubuntu-latest
            qt-arch: gcc_64
            artifact-name: spark-ts-tools-linux
            executable: spark-ts-tools
    runs-on: ${{ matrix.os }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Install Qt
      uses: jurplel/install-qt-action@v3
      with:
        version: 5.15.2
        cache: true
        arch: ${{ matrix.qt-arch || 'default' }}
        
    - name: Setup MSVC (Windows)
      if: runner.os == 'Windows'
      uses: microsoft/setup-msbuild@v1
      
    - name: Setup MSVC environment (Windows)
      if: runner.os == 'Windows'
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x86
        
    - name: Install dependencies (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libgl1-mesa-dev libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 libxcb-xinput0 libxcb-xfixes0
        
    - name: Build project (Windows)
      if: runner.os == 'Windows'
      run: |
        qmake Spark-Ts-Tools.pro CONFIG+=release
        nmake
        
    - name: Build project (Linux)
      if: runner.os == 'Linux'
      run: |
        qmake Spark-Ts-Tools.pro CONFIG+=release
        make -j$(nproc)
        
    - name: Package artifacts (Windows)
      if: runner.os == 'Windows'
      run: |
        mkdir package
        copy bin\${{ matrix.executable }} package\
        copy ssl\*.dll package\
        windeployqt package\${{ matrix.executable }}
        
    - name: Package artifacts (Linux)
      if: runner.os == 'Linux'
      run: |
        mkdir package
        cp bin/${{ matrix.executable }} package/
        
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact-name }}
        path: package/
        
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
    - name: Download Windows artifacts
      uses: actions/download-artifact@v4
      with:
        name: spark-ts-tools-windows
        path: windows-package/
        
    - name: Download Linux artifacts
      uses: actions/download-artifact@v4
      with:
        name: spark-ts-tools-linux
        path: linux-package/
        
    - name: Create Windows archive
      run: |
        cd windows-package
        zip -r ../spark-ts-tools-windows.zip .
        
    - name: Create Linux archive
      run: |
        cd linux-package
        tar -czf ../spark-ts-tools-linux.tar.gz .
        
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          spark-ts-tools-windows.zip
          spark-ts-tools-linux.tar.gz
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}